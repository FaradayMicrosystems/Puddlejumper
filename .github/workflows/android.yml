name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: puddlejumper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A pushed tag like v0.1.0 publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "puddlejumper-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" "puddlejumper-${GITHUB_REF_NAME}-debug.apk" \
            --title "Puddlejumper ${GITHUB_REF_NAME} (prototype)" \
            --notes "Install the .apk on Android 8.0 or newer. Allow installs from this source when your phone asks."
